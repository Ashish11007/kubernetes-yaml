apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
  namespace: apache
  labels:
    app: apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      name: my-apache-pod
      labels:
        app: apache
    spec:
      containers:
        - name: apache-container
          image: httpd:latest
          ports:
            - name: apache-port
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

...
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: apache
  labels:
    app: apache
spec:
  type: ClusterIP
  selector:
    app: apache
  ports:
    - name: apache-service-port
      protocol: TCP
      port: 80
      targetPort: 80
