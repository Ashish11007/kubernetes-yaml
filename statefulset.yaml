apiVersion: apps/v1
kind: statefulSet
metadata:
  name: my-ss
  labels:
    app: myapp
spec:
  serviceName: mysql-service
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: my-ss-template
      labels:
        app: myapp
    spec:
      containers:
        - name: mysql-container
          image: mysql:8.0
          ports:
            - name: mysql-port
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root@123"
            - name: MYSQL_DATABASE
              value: "mydb"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "admin@123"
...
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
spec:
  ClusterIP: none
  selector:
    app: myapp
  ports:
    - name: mysql-svc-port
      protocol: TCP
      port: 3306
      targetPort: 3306