apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: myapp
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:  
    matchLabels:
      app: myapp
  template:
    metadata:
      name: my-deployment-pod
      labels:
        app: myapp
    spec:
      containers:
        - name: cont
          image: nginx:latest
          ports:
            - name: myport
              containerPort: 80

...
---
apiVersion: v1
kind: Service
metadata:
  name: my-deployment-svc
  labels:
    app: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - name: my-svc-port
      protocol: TCP
      port: 80
      targetPort: 80