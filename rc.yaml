apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
  labels:
    app: myapp
spec:
  replicas: 2
  selector: 
    app: myapp
  template:
    metadata:
      name: myapp
      labels:
        app: myapp
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - name: nginx:port
              containerPort: 80

...
---
apiVersion: v1
kind: Service
metadata:
  name: rc-svc
  labels:
    app: myapp

spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - name: nginx-svc-port
      protocol: TCP
      port: 80
      targetPort: 80