apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - name: nginx-port
          containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata:
  name: ci-service
  labels:
    app: myapp
spec:
  type: ClusterIP
  selector:
    app: myapp
  ports:
    - name: nginx-svc-port
      protocol: TCP
      port: 80
      targetPort: 80

      