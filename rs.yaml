apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-rs
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      name: my-rs-template
      labels:
        app: myapp
    spec:
      containers:
        - name: httpd-container
          image: httpd:latest
          ports:
            - name: httpd-port
              containerPort: 80
...
---
apiVersion: v1
kind: Service 
metadata:
  name: rs-svc
  labels:
    app: myapp

spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - name: httpd-svc-port
      protocol: TCP
      port: 80
      targetPort: 80
      