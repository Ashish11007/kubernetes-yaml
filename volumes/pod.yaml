apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
spec:
  volumes:
    - name: myvolume
      persistentVolumeClaim:
        claimName: mypvc

      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - name: myport
              containerPort: 80
          volumeMounts:
          - name: myvolume
            mountPath: /usr/share/nginx/html/